[project]
name = "amazing-splitwise-mcp"
version = "0.1.0"
description = "MCP server for the Splitwise API v3.0 (personal API key, stdio by default, streamable-http behind a bearer)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Alejandro Latorre" }]
keywords = [
    "python",
    "splitwise",
    "expenses",
    "shared-expenses",
    "mcp",
    "llm-tools",
    "model-context-protocol",
    "mcp-server",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.13"
dependencies = [
    # Capped below 2.0: the SDK's 2.x line drops `mcp.server.fastmcp` (FastMCP became
    # `mcp.server.mcpserver.MCPServer`) and moves `mcp.types` out to the separate
    # `mcp-types` package, so an unbounded spec makes `uvx amazing-splitwise-mcp`
    # resolve to 2.x and die with ModuleNotFoundError on import. The streamable-http
    # transport (uvicorn + starlette) ships with the SDK itself.
    "mcp>=1.1.0,<2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/trustxai/splitwise-mcp"
Repository = "https://github.com/trustxai/splitwise-mcp"
Issues = "https://github.com/trustxai/splitwise-mcp/issues"
Changelog = "https://github.com/trustxai/splitwise-mcp/blob/main/CHANGELOG.md"

[project.scripts]
# Dist + script are both `amazing-splitwise-mcp` (ADR-0001: `splitwise-mcp` and
# `splitwise-mcp-server` are taken on PyPI) so `uvx amazing-splitwise-mcp` resolves with no --from.
amazing-splitwise-mcp = "splitwise_mcp.server:main_stdio"
# The remote transport: streamable-http behind a bearer token, for hosts that cannot
# spawn a local process (Grok Bot). `uvx --from amazing-splitwise-mcp amazing-splitwise-mcp-http`.
amazing-splitwise-mcp-http = "splitwise_mcp.server:main_http"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/splitwise_mcp"]

[dependency-groups]
dev = [
    # mcp[cli] provides the `mcp` dev CLI (mcp dev / inspector); the runtime
    # server needs only core `mcp`, so the CLI extra lives here.
    "mcp[cli]>=1.1.0,<2",
    "pre-commit>=4.0",
    "ruff>=0.11",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: integration tests against the real Splitwise account (requires SPLITWISE_API_KEY in .env; read-only)",
    "live_write: mutating integration tests (create + delete a throwaway group/expense) — run ONLY with SPLITWISE_TEST_ALLOW_WRITES=1",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-third-party = ["mcp", "pydantic", "httpx", "starlette", "uvicorn"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["splitwise_mcp.*"]
disallow_untyped_defs = true
